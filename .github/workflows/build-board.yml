name: Board bauen und veröffentlichen

# Dieser Workflow ist das Backend. GitHub Pages ist statisch und kann die Feeds
# nicht selbst holen (ForexFactory, Myfxbook: kein CORS) — der Runner kann es,
# dort existiert die Browser-Beschränkung nicht.
#
# Nebeneffekt und eigentlicher Gewinn: Jeder Lauf committet einen Snapshot nach
# data/history/. Das ergibt eine lückenlose, zeitgestempelte Signal-Historie und
# ist die Voraussetzung für den Backtest.

on:
  schedule:
    # Alle 6 Stunden. Für einen Tages-Bias reichlich — COT ist wöchentlich,
    # Makrodaten monatlich, nur das Retail-Sentiment bewegt sich schneller.
    - cron: "0 */6 * * *"
    # Freitag nach dem CFTC-Release (15:30 ET = 19:30/20:30 UTC je nach Sommerzeit).
    - cron: "0 21 * * 5"
  workflow_dispatch: # manuell auslösbar
  push:
    branches: [main]
    paths: # bei Code-Änderungen sofort neu bauen
      - "web/**"
      - "server/**"
      - ".github/workflows/build-board.yml"

permissions:
  contents: write # Snapshots zurückcommitten
  pages: write
  id-token: write

# Läufe nicht überlappen lassen; laufende Deployments aber zu Ende bringen.
concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Daten holen und Scoring rechnen
        run: node server/build.js

      - name: Snapshot committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Nur committen, wenn sich wirklich etwas geändert hat —
          # sonst füllt sich die Historie mit Leercommits.
          if git diff --staged --quiet; then
            echo "keine Änderung, nichts zu committen"
          else
            git commit -m "Board-Snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/board.json _site/data/board.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
